<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; script-src 'self' app:; style-src 'self' 'unsafe-inline' app:; img-src 'self' app: data:;"
    />
    <title>Obsidian Arch</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --bg-2: #262626;
        --bg-3: #2f2f2f;
        --text: #dadada;
        --muted: #a0a0a0;
        --faint: #6b6b6b;
        --border: rgba(255, 255, 255, 0.09);
        --accent: #7f6df2;
        --danger: #e05252;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }
      .titlebar {
        height: 44px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .wrap {
        flex: 1 1 auto;
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
        padding: 8px 28px 32px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; }
      .sub { color: var(--faint); font-size: 12px; margin: 0 0 22px; }
      .actions { display: flex; gap: 8px; margin-bottom: 22px; }
      .btn {
        height: 34px;
        padding: 0 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-3);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.12); }
      .btn-primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 500; }
      .btn-primary:hover { background: #8f80f5; }
      .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--faint);
        margin-bottom: 6px;
      }
      .list { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
      .vault {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .vault:hover { background: var(--bg-2); border-color: var(--border); }
      .vault-main { min-width: 0; flex: 1 1 auto; }
      .vault-name { font-size: 13px; color: var(--text); }
      .vault-path {
        margin-top: 2px;
        font-size: 11px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vault-remove {
        width: 24px; height: 24px;
        border: none; border-radius: 4px;
        background: transparent; color: var(--faint);
        cursor: pointer; font-size: 14px; line-height: 1;
        opacity: 0;
      }
      .vault:hover .vault-remove { opacity: 1; }
      .vault-remove:hover { background: rgba(224, 82, 82, 0.18); color: var(--danger); }
      .empty { color: var(--faint); font-style: italic; padding: 14px 12px; }
      .footer { text-align: center; font-size: 11px; color: var(--faint); padding-top: 14px; }
      dialog {
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        background: var(--bg-2);
        color: var(--text);
        padding: 20px;
        width: 380px;
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
      dialog h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
      dialog input {
        width: 100%;
        height: 32px;
        padding: 0 10px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        outline: none;
      }
      dialog input:focus { border-color: var(--accent); }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      .hint { margin-top: 8px; font-size: 11px; color: var(--faint); word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="titlebar">OBSIDIAN ARCH</div>
    <div class="wrap">
      <h1>Open a vault</h1>
      <p class="sub">A vault is a folder of plain Markdown files.</p>
      <div class="actions">
        <button class="btn btn-primary" id="open-folder">Open folder as vault</button>
        <button class="btn" id="create-vault">Create new vault</button>
      </div>
      <div class="label">Recent vaults</div>
      <div class="list" id="vault-list"></div>
      <div class="footer" id="footer"></div>
    </div>
    <dialog id="create-dialog">
      <form method="dialog">
        <h2>Create vault</h2>
        <input id="vault-name" type="text" placeholder="Vault name" autocomplete="off" />
        <div class="hint" id="create-location"></div>
        <div class="dialog-actions">
          <button class="btn" value="cancel" formnovalidate>Cancel</button>
          <button class="btn btn-primary" value="create" id="confirm-create">Create</button>
        </div>
      </form>
    </dialog>
    <script src="starter.js"></script>
  </body>
</html>
